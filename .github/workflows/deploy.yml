name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.13.4
      - name: Set up Python
        run: |
          uv python install 3.11.17
          uv venv --python 3.11.17 .venv
      - name: Install locked dependencies
        run: uv pip sync --python .venv/bin/python requirements-linux-py311.lock.txt
      - name: Check installed graph
        run: uv pip check --python .venv/bin/python
      - name: Check notebook runtime packages and plotting API
        run: .venv/bin/python tests/check_notebook_plotly.py
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          .venv/bin/jupyter lite build --contents content --output-dir dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
